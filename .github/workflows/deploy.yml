name: Forward the old GitHub Pages address

# The newspaper is now hosted in the school's Google account (google-workspace/SETUP.md). The old
# GitHub Pages address only forwards readers: the front page to the Google Site, an old article
# address to that article. This publishes the two small pages in redirect/ and nothing else.
on:
  push:
    branches: [main]
    paths: ['redirect/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The forwarding pages name the publisher's web address
        run: "! grep -l '__WEB_APP_URL__' redirect/*.html"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
