name: Deploy to GitHub Pages

# Publishes the site whenever `main` changes. (Articles from the Google Sheet are published by
# sync-docs.yml, which builds and deploys in one go.)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # always publish the newest main, including a commit made moments ago
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run check
      - name: Build
        run: npm run build
        env:
          # configure-pages reports the right values for both ORG.github.io/REPO and a custom domain.
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Repository variable. Leave unset until launch day; then set it to "true".
          SITE_INDEXABLE: ${{ vars.SITE_INDEXABLE }}
      - name: Tests and checks (a failure stops the deploy)
        run: npm test && npm run check:links && npm run check:media
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_INDEXABLE: ${{ vars.SITE_INDEXABLE }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
