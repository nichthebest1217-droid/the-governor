name: Publish from the Google Sheet

# The staff's Google Sheet starts this about a minute after an editor changes something (see
# google-workspace/SETUP.md). It asks the Sheet what changed, brings the articles in line (adds,
# updates, takes down), checks the result like any other change, commits it and publishes the
# site. The commit uses this workflow's own built-in access: no personal token is stored here.
on:
  workflow_dispatch:
  schedule:
    # Backup for when the Sheet cannot reach GitHub. GitHub runs schedules late, or skips them
    # when it is busy, so in practice this may run only every few hours.
    - cron: '4,19,34,49 * * * *'

permissions:
  contents: read

concurrency:
  group: sync-docs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    outputs:
      publish: ${{ steps.build.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Anything new in the Sheet? Is the website up to date?
        id: check
        run: node scripts/sync-docs.ts --check
      - name: Install
        if: steps.check.outputs.changed == 'true'
        run: npm ci
      - name: Bring the articles in line with the Sheet
        if: steps.check.outputs.changed == 'true'
        run: node scripts/sync-docs.ts
      - name: What changed
        id: diff
        if: steps.check.outputs.changed == 'true'
        run: |
          git add -A src/content public/media src/data
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; git diff --cached --stat; fi
      - id: pages
        if: steps.diff.outputs.changed == 'true' || steps.check.outputs.redeploy == 'true'
        uses: actions/configure-pages@v6
      - name: Check, build and commit (if anything fails, nothing is committed or published)
        id: build
        if: steps.diff.outputs.changed == 'true' || steps.check.outputs.redeploy == 'true'
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_INDEXABLE: ${{ vars.SITE_INDEXABLE }}
        run: |
          verify() { npm run check && npm run build && npm test && npm run check:links && npm run check:media; }
          verify
          if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
            git config user.name "The Governor publishing sheet"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            { echo "content: publish changes from the Google Sheet"; echo; cat "$RUNNER_TEMP/sync-summary.txt" 2>/dev/null || true; } > "$RUNNER_TEMP/message.txt"
            git commit -q -F "$RUNNER_TEMP/message.txt"
            pushed=false
            for attempt in 1 2 3; do
              if git push -q origin HEAD:main; then pushed=true; break; fi
              # Someone pushed to main meanwhile: put this commit on top of theirs and check everything again.
              git pull -q --rebase origin main
              verify
            done
            [ "$pushed" = true ]
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v5
        if: steps.build.outputs.publish == 'true'
        with:
          path: dist

  publish:
    needs: sync
    if: needs.sync.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
