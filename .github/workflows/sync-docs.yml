name: Collect approved articles from the Google Sheet

# Every half hour (and on demand) this asks the staff's Google Sheet for articles marked
# Approved, checks them like any other change, commits them and publishes the site.
# No personal access token is involved: the commit uses this workflow's own built-in access.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-docs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect approved rows
        run: node scripts/sync-docs.ts
      - name: Anything new?
        id: diff
        run: |
          git add -A src/content public/media
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Check the new content before it is committed
        if: steps.diff.outputs.changed == 'true'
        run: npm run check && npm run build && npm test && npm run check:links && npm run check:media
      - name: Commit
        id: commit
        run: |
          if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
            git config user.name "The Governor publishing sheet"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "content: articles approved in the publication sheet"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
